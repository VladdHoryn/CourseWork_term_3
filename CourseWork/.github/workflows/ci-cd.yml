name: CI/CD for C# Coursework App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ------------------------------
  # STEP 1 — Build + Test + Docker
  # ------------------------------
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (якщо є)
        run: dotnet test --no-build --verbosity normal || echo "No tests found"

      # ------------------------------
      # Docker build
      # ------------------------------
      - name: Build Docker image
        run: docker build -t coursework-app .

      # DockerHub login
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag coursework-app ${{ secrets.DOCKER_USERNAME }}/coursework-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/coursework-app:latest

  # --------------------------------
  # STEP 2 — Deploy on VPS automatically
  # --------------------------------
  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/coursework-app:latest
            
            docker stop coursework-app || true
            docker rm coursework-app || true

            docker run -d \
              -p 80:8080 \
              --name coursework-app \
              -e ASPNETCORE_ENVIRONMENT=Production \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/coursework-app:latest
